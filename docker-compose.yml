services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: us360
      POSTGRES_PASSWORD: us360_dev_password
      POSTGRES_DB: us360
    ports:
      - "5432:5432"
    volumes:
      - us360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U us360 -d us360"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  us360_pgdata:
